[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-examples"
version = "0.1.0"
description = "Runnable, tested and deployable PyTorch examples with docs and notebooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbclient>=0.10",
]
docs = ["mkdocs>=1.6"]

[project.scripts]
pytorch-examples = "pytorch_examples.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "notebooks: executes the example notebooks (slower; needs the 'notebooks' extra)",
]
